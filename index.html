<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3a78">
<title>외국인을 위한 고속도로 미납통행료 조회·납부 안내</title>
<style>
:root{--navy:#0b3a78;--blue:#0b63b6;--line:#d7e3f1;--bg:#f5f8fc;--muted:#5e6e82;--danger:#9f2118;--dangerbg:#fff1ef}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#18283f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Noto Sans",Arial,sans-serif;line-height:1.55}
button,input,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.topin{max-width:920px;margin:auto;min-height:62px;padding:9px 14px;display:flex;align-items:center;gap:10px}.logo{width:180px;max-width:54vw}.hq{font-weight:800;color:var(--navy);border-left:1px solid #cbd7e5;padding-left:10px}.sp{flex:1}.langsel{border:1px solid #b9c8da;border-radius:10px;background:#fff;padding:8px 10px;max-width:160px}
.review{text-align:center;background:#fff4cc;color:#654e00;border-bottom:1px solid #f7dc7b;font-weight:800;font-size:13px;padding:6px}
main{max-width:920px;margin:auto;padding:18px 13px 56px}.hero{border:1px solid var(--line);border-radius:22px;background:linear-gradient(135deg,#eef8ff,#fffde6);padding:28px 22px}
h1{margin:0;color:#07336f;font-size:clamp(28px,6vw,48px);line-height:1.16;letter-spacing:-.02em}.hero p{color:#4c5d73;margin:12px 0 0}
.choose{margin:24px 0 12px;font-size:20px;font-weight:900;color:#123967}.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.lbtn{border:1px solid #c9d8e8;background:#fff;border-radius:15px;padding:17px 8px;box-shadow:0 3px 12px rgba(20,60,110,.04)}.lbtn b{display:block;font-size:18px;color:#0b3a78}.lbtn small{display:block;color:#748196;margin-top:3px}
.info{margin-top:14px;border:1px solid #dce6f1;background:#f3f7fb;border-radius:12px;padding:12px;color:#53647a;font-size:14px}
.warn{margin:16px 0;border:1px solid #efb7b0;background:var(--dangerbg);border-radius:18px;padding:18px}.warn h2{margin:0 0 8px;color:var(--danger);font-size:clamp(22px,5vw,34px);line-height:1.25}.warn .p{font-weight:900;color:#9a2a22;line-height:1.7}.warn .a{font-weight:700;margin-top:5px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:1px solid var(--line);background:#fff;border-radius:17px;padding:20px 16px;text-align:left}.card .ico{font-size:29px}.card h3{color:var(--navy);margin:8px 0 3px;font-size:19px}.card p{color:#66768a;margin:0;font-size:14px}
.head{display:flex;gap:10px;align-items:center;margin-bottom:14px}.back{border:1px solid #c8d6e6;background:#fff;color:var(--navy);border-radius:9px;padding:8px 11px;font-weight:800}.head h2{margin:0;color:var(--navy);font-size:clamp(25px,5vw,36px)}
.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;margin-bottom:13px}.panel h3{color:var(--navy);font-size:21px;margin:0 0 9px}.panel p{color:#4e5f75;margin:6px 0}
.helper{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:10px;align-items:end}.field label{display:block;font-size:14px;font-weight:800;color:#3f536b;margin-bottom:5px}.field input{width:100%;border:1px solid #afc0d2;border-radius:9px;padding:11px}
.hang{display:flex;flex-wrap:wrap;gap:5px;max-height:140px;overflow:auto;border:1px solid #cedae7;border-radius:10px;padding:7px;background:#f8fbff}.hc{border:1px solid #b9c9dc;background:#fff;border-radius:7px;padding:6px 9px;font-weight:800;min-width:39px}.hc.on{background:#0b63b6;color:#fff;border-color:#0b63b6}
.preview{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding:12px;background:#edf6ff;border-radius:11px}.plate{font-size:22px;font-weight:900;color:var(--navy)}.copy{margin-left:auto;border:0;background:#0b63b6;color:#fff;border-radius:8px;padding:8px 13px;font-weight:800}
.steps{display:grid;gap:9px;counter-reset:n}.step{display:grid;grid-template-columns:32px 1fr;gap:9px;align-items:start}.step:before{counter-increment:n;content:counter(n);width:29px;height:29px;border-radius:50%;background:#0b63b6;color:#fff;display:grid;place-items:center;font-weight:900}
.notice{margin-top:12px;border-left:5px solid #0b63b6;background:#eef6ff;padding:12px;border-radius:9px;font-weight:800}.cta{display:block;margin-top:12px;background:#0b4a96;color:#fff!important;text-decoration:none;text-align:center;padding:14px;border-radius:11px;font-weight:900}
.contacts{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.contact{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px}.contact h3{color:var(--navy);margin:0 0 6px}.num{font-size:21px;font-weight:900;color:#0b55a3;margin:5px 0}
details{background:#fff;border:1px solid var(--line);border-radius:13px;margin-bottom:9px;overflow:hidden}summary{padding:14px 15px;font-weight:900;color:var(--navy);cursor:pointer}details p{margin:0;padding:0 15px 15px;color:#4d5e74}.foot{text-align:center;color:#738197;font-size:13px;margin-top:25px}
.hidden{display:none!important}
@media(max-width:700px){.grid9{grid-template-columns:repeat(2,1fr)}.cards,.contacts,.helper{grid-template-columns:1fr}.logo{width:150px}.hq{font-size:13px}.langsel{max-width:120px}.hero{padding:23px 17px}}
</style>
</head>
<body>
<div class="top"><div class="topin"><img src="assets/kec_ci.png" class="logo" alt="한국도로공사"><span id="hq" class="hq hidden">수도권본부</span><span class="sp"></span><select id="ls" class="langsel" aria-label="Language"></select></div></div>
<div class="review">번역 검증용 시안 · Translation review draft</div>
<main id="app"></main>
<script>
const OFFICIAL='https://www.hipass.co.kr/main.do';
const H=['가','나','다','라','마','거','너','더','러','머','버','서','어','저','고','노','도','로','모','보','소','오','조','구','누','두','루','무','부','수','우','주','아','바','사','자','배','허','하','호'];
let T={},lang='ko',hang='가';
const app=document.getElementById('app'),ls=document.getElementById('ls'),hq=document.getElementById('hq');
const e=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
fetch('translations.json').then(r=>r.json()).then(x=>{T=x;route()});
function setLang(c){lang=T[c]?c:'ko';document.documentElement.lang=lang;hq.classList.toggle('hidden',lang!=='ko');ls.innerHTML=Object.entries(T).map(([k,v])=>`<option value="${k}">${e(v.native)}</option>`).join('');ls.value=lang}
ls.onchange=()=>{location.hash='#menu-'+ls.value};
function langPage(){setLang('ko');const t=T.ko;app.innerHTML=`<section class="hero"><h1>${e(t.title)}</h1><p>${e(t.subtitle)}</p><div class="choose">${e(t.choose)}</div><div class="grid9">${Object.entries(T).map(([k,v])=>`<button class="lbtn" onclick="location.hash='#menu-${k}'"><b>${e(v.native)}</b><small>${e(v.label)}</small></button>`).join('')}</div><div class="info">${e(t.note)}</div></section>`}
function menu(c){setLang(c);const t=T[c];app.innerHTML=`<section class="hero"><h1>${e(t.title)}</h1><p>${e(t.subtitle)}</p></section><section class="warn"><h2>${e(t.warning)}</h2><div class="p">${e(t.penalties)}</div><div class="a">${e(t.action)}</div></section><div class="cards"><button class="card" onclick="location.hash='#guide-${c}'"><div class="ico">🚘</div><h3>${e(t.guide)}</h3><p>${e(t.helperDesc)}</p></button><button class="card" onclick="location.hash='#support-${c}'"><div class="ico">☎️</div><h3>${e(t.support)}</h3><p>${e(t.phoneDesc)}</p></button><button class="card" onclick="location.hash='#faq-${c}'"><div class="ico">⚠️</div><h3>${e(t.faq)}</h3><p>${e(t.a1)}</p></button></div><div class="info">${e(t.note)}</div><div class="foot">Korea Expressway Corporation · 1588-2504</div>`}
function head(t){return `<div class="head"><button class="back" onclick="location.hash='#menu-${lang}'">← ${e(t.back)}</button><h2>${e(t.menu)}</h2></div>`}
function guide(c){setLang(c);const t=T[c];app.innerHTML=head(t)+`<section class="panel"><h3>${e(t.guide)}</h3><p><b>${e(t.guideLead)}</b></p></section><section class="panel"><h3>${e(t.helper)}</h3><p>${e(t.helperDesc)}</p><div class="helper"><div class="field"><label>${e(t.front)}</label><input id="f" inputmode="numeric" maxlength="3" placeholder="123"></div><div class="field"><label>${e(t.hangul)}</label><div class="hang">${H.map(x=>`<button class="hc ${x===hang?'on':''}" data-h="${x}">${x}</button>`).join('')}</div></div><div class="field"><label>${e(t.back)}</label><input id="b" inputmode="numeric" maxlength="4" placeholder="4567"></div></div><div class="preview"><span>${e(t.complete)}:</span><span id="p" class="plate">123${hang}4567</span><button id="cp" class="copy">${e(t.copy)}</button></div></section><section class="panel"><div class="steps"><div class="step">${e(t.step1)}</div><div class="step">${e(t.step2)}</div><div class="step">${e(t.step3)}</div><div class="step">${e(t.step4)}</div></div><div class="notice">🔒 ${e(t.officialOnly)}</div><a class="cta" href="${OFFICIAL}" target="_blank" rel="noopener">${e(t.officialBtn)} ↗</a></section>`;bindHelper(t)}
function bindHelper(t){const f=document.getElementById('f'),b=document.getElementById('b'),p=document.getElementById('p');function u(){p.textContent=(f.value.replace(/\D/g,'').slice(0,3)||'123')+hang+(b.value.replace(/\D/g,'').slice(0,4)||'4567')}f.oninput=()=>{f.value=f.value.replace(/\D/g,'').slice(0,3);u()};b.oninput=()=>{b.value=b.value.replace(/\D/g,'').slice(0,4);u()};document.querySelectorAll('.hc').forEach(x=>x.onclick=()=>{hang=x.dataset.h;document.querySelectorAll('.hc').forEach(y=>y.classList.toggle('on',y.dataset.h===hang));u()});document.getElementById('cp').onclick=async()=>{try{await navigator.clipboard.writeText(p.textContent)}catch(_){const z=document.createElement('textarea');z.value=p.textContent;document.body.appendChild(z);z.select();document.execCommand('copy');z.remove()}}}
function support(c){setLang(c);const t=T[c];app.innerHTML=head(t)+`<div class="contacts"><section class="contact"><h3>☎️ ${e(t.phonePay)}</h3><b>${e(t.phoneOrg)}</b><div class="num">031-361-3021~3026</div><p>${e(t.phoneHours)}</p><p>${e(t.phoneDesc)}</p></section><section class="contact"><h3>🏢 ${e(t.visit)}</h3><p>${e(t.visitDesc)}</p></section><section class="contact"><h3>💬 ${e(t.chat)}</h3><p>${e(t.chatDesc)}</p><a class="cta" href="${OFFICIAL}" target="_blank">${e(t.officialBtn)} ↗</a></section><section class="contact"><h3>🌐 ${e(t.interpret)}</h3><div class="num">1588-5644</div><p>${e(t.interpretDesc)}</p></section><section class="contact"><h3>📞 ${e(t.callcenter)}</h3></section></div>`}
function faq(c){setLang(c);const t=T[c];app.innerHTML=head(t)+`<section class="warn"><h2>${e(t.warning)}</h2><div class="p">${e(t.penalties)}</div></section><details open><summary>${e(t.q1)}</summary><p>${e(t.a1)}</p></details><details><summary>${e(t.q2)}</summary><p>${e(t.a2)}</p></details><details><summary>${e(t.q3)}</summary><p>${e(t.a3)}</p></details><div class="info">${e(t.note)}</div>`}
function route(){if(!Object.keys(T).length)return;const h=(location.hash||'').replace('#','');if(!h||h==='language'||h.startsWith('language-'))return langPage();const m=h.match(/^(menu|guide|support|faq)-(ko|en|zh|vi|ru|uz|mn|my|ne)$/);if(!m)return langPage();({menu,guide,support,faq}[m[1]])(m[2])}
window.addEventListener('hashchange',route);
</script>
</body></html>
